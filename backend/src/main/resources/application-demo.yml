server:
  port: 9080
spring:
  datasource:
    url: "jdbc:h2:file:${DEMO_DB_PATH:./data/demo};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=LOW"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      schema-locations: classpath:db/schema-h2.sql,classpath:db/extensions.sql
app:
  demo: true
  system-admins: demo_admin
