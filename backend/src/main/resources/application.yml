server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

app:
  system-admins: ${SYSTEM_ADMINS:}

spring:
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  sql:
    init:
      mode: always
      schema-locations: classpath:db/extensions.sql
  application:
    name: family-tree
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: "jdbc:mysql://localhost:3306/family_tree?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8"
    username: family_app
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
